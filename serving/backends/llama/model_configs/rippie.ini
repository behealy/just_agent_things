version = 1

; Global settings shared across all presets
[*]
; n-gpu-layers = 999
batch-size = 4096
ubatch-size = 2048

[DeepSeek-V4-Flash]
model = ./serving/models/unsloth/DeepSeek-V4-Flash-0731-GGUF/UD-Q4_K_XL/DeepSeek-V4-Flash-0731-UD-Q4_K_XL-00001-of-00005.gguf
alias = deepseek-v4-flash-UD-Q4_K_XL
n-cpu-moe = 29
ts = 35,8
c = 131072
;no-mmap = true
parallel = 1
threads = 12
; n-gpu-layers = auto
threads-batch = 24
temp = 1.0
top-p = 1.0
min-p = 0.01
reasoning = on
reasoning-format = deepseek

[Qwen3.6-35B-A3B]
model = ./serving/models/Qwen3.6-35B-A3B-UD-Q8_K_XL.gguf
split-mode = tensor
tensor-split = 1,1

; Default sampling parameters are based on the Qwen recommendation for "Thinking mode for precise coding tasks"
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

; Qwen3.8 27B — dense model, UD-Q8_K_XL quantization
[Qwen3.8-27B-Q8_K_XL]
model = ./serving/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q8_K_XL.gguf
split-mode = tensor
tensor-split = 1,1
c = 262144

; Default sampling parameters are based on the Qwen recommendation for "Thinking mode for precise coding tasks"
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

; Qwen3.8 27B — dense model, UD-Q6_K_XL quantization (smaller, faster)
[Qwen3.8-27B-Q6_K_XL]
model = ./serving/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q6_K_XL.gguf
split-mode = tensor
tensor-split = 1,1
c = 262144

; Default sampling parameters are based on the Qwen recommendation for "Thinking mode for precise coding tasks"
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

; DeepSeek V4 Flash with Dspark — speculative decoding (use base as main, dspark as draft)
[DeepSeek-V4-Flash-DSpark]
model = ./serving/models/unsloth/DeepSeek-V4-Flash-0731-GGUF/UD-Q4_K_XL/DeepSeek-V4-Flash-0731-UD-Q4_K_XL-00001-of-00005.gguf
model-draft = ./serving/models/unsloth/DeepSeek-V4-Flash-0731-GGUF/dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf
alias = deepseek-v4-flash-UD-Q4_K_XL-dspark
n-gpu-layers = all
c = 262144
spec-draft-n-max = 8
spec-draft-p-split = 0.1
temp = 0.8
top-p = 1.0
min-p = 0.01
reasoning = on
reasoning-format = deepseek

; Laguna-S 2.1 — 671B MoE (22B active), UD-Q8_K_XL quantization
[Laguna-S-2.1-Q8_K_XL]
model = ./serving/models/unsloth/Laguna-S-2.1-GGUF/UD-Q8_K_XL/Laguna-S-2.1-UD-Q8_K_XL-00001-of-00004.gguf
alias = laguna-s-2.1-UD-Q8_K_XL
; Dflash is broken for laguna: https://huggingface.co/poolside/Laguna-S-2.1-GGUF/discussions/3.
; model-draft = ./models/unsloth/Laguna-S-2.1-GGUF/laguna-s-2.1-DFlash-BF16.gguf
; spec-type = draft-dflash
n-cpu-moe = 32
c = 196608
ts = 18,5
temp = 0.7
top-p = 0.9
top-k = 40
min-p = 0.01
reasoning-preserve = true

;spec-draft-n-max = 12
;spec-draft-p-split = 0.1

; Laguna-S 2.1 — 671B MoE (22B active), UD-Q6_K quantization (smaller, faster)
[Laguna-S-2.1-Q6_K]
model = ./serving/models/unsloth/Laguna-S-2.1-GGUF/UD-Q6_K/Laguna-S-2.1-UD-Q6_K-00001-of-00003.gguf
alias = laguna-s-2.1-UD-Q6_K
; model-draft = ./models/unsloth/Laguna-S-2.1-GGUF/laguna-s-2.1-DFlash-BF16.gguf
; spec-type = draft-dflash
c = 262144
n-cpu-moe = 29
ts = 15,5
temp = 0.7
top-p = 0.9
top-k = 40
min-p = 0.01
reasoning-preserve = true
; spec-draft-n-max = 12
; spec-draft-p-split = 0.1

; Gemma 4 31B IT — QAT UD-Q4_K_XL, multimodal (text + vision)
[Gemma-4-31B-IT]
model = ./serving/models/unsloth/gemma-4-31B-it-qat-GGUF/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
mmproj = ./serving/models/unsloth/gemma-4-31B-it-qat-GGUF/mmproj-F32.gguf
alias = gemma-4-31b-it-qat-UD-Q4_K_XL
n-gpu-layers = all
temp = 0.9
top-p = 0.95
top-k = 40
min-p = 0.01

; Gemma 4 31B IT with MTP — speculative decoding (use base as main, MTP as draft)
[Gemma-4-31B-IT-MTP]
model = ./serving/models/unsloth/gemma-4-31B-it-qat-GGUF/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
mmproj = ./serving/models/unsloth/gemma-4-31B-it-qat-GGUF/mmproj-F32.gguf
model-draft = ./models/unsloth/gemma-4-31B-it-qat-GGUF/mtp-gemma-4-31B-it.gguf
alias = gemma-4-31b-it-qat-UD-Q4_K_XL-mtp
n-gpu-layers = all
spec-draft-n-max = 8
spec-draft-p-split = 0.1
temp = 0.9
top-p = 0.95
top-k = 40
min-p = 0.01
